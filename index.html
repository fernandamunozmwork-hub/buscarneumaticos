<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Cardepot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --amarillo: #FFCC00;
      --negro: #141414;
      --negro-suave: #2A2A2A;
      --blanco: #FFFFFF;
      --gris-fondo: #F5F5F3;
      --gris-borde: #E4E2DC;
      --gris-texto: #5B5B54;
      --rojo: #E2001A;
      --rojo-fondo: #FBE1E1;
      --verde: #1E7A3D;
      --verde-fondo: #E1F0E4;
      --ambar: #B4791E;
      --ambar-fondo: #F6E9D2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--gris-fondo);
      color: var(--negro);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    /* HEADER estilo franja de marca */
    header {
      background: var(--negro);
      padding: 22px 20px 26px;
      position: relative;
      overflow: hidden;
    }
    header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 6px;
      background: var(--amarillo);
    }
    .marca {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--amarillo);
      color: var(--negro);
      border: 2px solid var(--negro);
      border-radius: 4px;
      padding: 4px 10px;
      font-family: 'Archivo Black', sans-serif;
      font-size: 12px;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }
    h1 {
      font-family: 'Archivo Black', sans-serif;
      color: var(--blanco);
      font-size: 26px;
      line-height: 1.15;
      margin: 0 0 4px;
      text-transform: uppercase;
    }
    h1 span { color: var(--amarillo); }
    .subtitulo {
      color: #C9C9C4;
      font-size: 14px;
      margin: 0;
    }

    /* BUSCADOR */
    .zona-buscador {
      padding: 18px 20px 0;
      max-width: 720px;
      margin: 0 auto;
    }
    .caja-buscador {
      display: flex;
      background: var(--blanco);
      border: 2px solid var(--negro);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 4px 4px 0 var(--amarillo);
    }
    .caja-buscador input {
      flex: 1;
      border: none;
      padding: 14px 14px;
      font-size: 16px;
      font-family: 'Inter', sans-serif;
      outline: none;
      background: transparent;
      color: var(--negro);
    }
    .caja-buscador input::placeholder { color: #A8A8A0; }
    .caja-buscador .icono {
      display: flex;
      align-items: center;
      padding: 0 14px;
      background: var(--amarillo);
      font-size: 18px;
    }

    #estado {
      max-width: 720px;
      margin: 12px auto 0;
      padding: 0 20px;
      font-size: 13px;
      color: var(--gris-texto);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-descargar {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 12.5px;
      background: var(--amarillo);
      color: var(--negro);
      border: 1.5px solid var(--negro);
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-descargar:hover { background: #E6B800; }
    .btn-descargar:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* RESULTADOS EN TARJETAS */
    #resultados {
      max-width: 720px;
      margin: 14px auto 60px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tarjeta {
      background: var(--blanco);
      border: 1.5px solid var(--gris-borde);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tarjeta-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .tarjeta-nombre {
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--negro);
    }
    .tarjeta-medida {
      display: inline-block;
      font-family: 'Roboto Mono', monospace;
      font-weight: 700;
      font-size: 12px;
      background: var(--negro);
      color: var(--amarillo);
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .tarjeta-meta {
      font-size: 12.5px;
      color: var(--gris-texto);
    }
    .tarjeta-meta b { color: var(--negro-suave); }

    .tarjeta-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed var(--gris-borde);
      padding-top: 10px;
      margin-top: 2px;
    }
    .precio {
      font-family: 'Roboto Mono', monospace;
      font-weight: 700;
      font-size: 18px;
      color: var(--negro);
    }

    .estado-stock {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 20px;
    }
    .estado-stock.disponible { background: var(--verde-fondo); color: var(--verde); }
    .estado-stock.poco { background: var(--ambar-fondo); color: var(--ambar); }
    .estado-stock.sin { background: var(--rojo-fondo); color: var(--rojo); }

    .btn-sucursales {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 12.5px;
      background: var(--negro);
      color: var(--blanco);
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .btn-sucursales:hover { background: var(--negro-suave); }

    .vacio {
      text-align: center;
      padding: 40px 20px;
      color: var(--gris-texto);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <span class="marca">🛞 NEUMÁTICOS DEL PACÍFICO</span>
    <h1>Stock <span>Cardepot</span></h1>
    <p class="subtitulo">Escribí la medida de tu neumático y consultá precio y disponibilidad</p>
  </header>

  <div class="zona-buscador">
    <div class="caja-buscador">
      <input type="text" id="buscador" placeholder="Ej: 175/70 R13" autocomplete="off">
      <div class="icono">🔍</div>
    </div>
  </div>

  <p id="estado">
    <span id="estado-texto">Cargando productos...</span>
    <button class="btn-descargar" id="btn-descargar" disabled>⬇ Descargar Excel</button>
  </p>
  <div id="resultados"></div>

  <script>
    // Ahora la página le pregunta a tu propio servidor (Cloudflare Worker),
    // no a Google directamente. El link real de la planilla queda oculto ahí.
    const URL_DATOS = 'https://stock-neumaticos.fernanda-munozm-work.workers.dev/';

    const SUCURSALES = [
      'CD', 'estoril', 'ossa',
      'movicenter', 'diezjulio', 'mapocho', 'lascondes', 'granav', 'plazaoeste',
      'macul', 'dominica', 'catorcedelafama', 'vicuñamackenna', 'goodyear'
    ];

    let productos = [];
    let ultimoFiltrado = [];

    function parsearLineaCSV(linea) {
      const resultado = [];
      let actual = '';
      let entreComillas = false;

      for (let i = 0; i < linea.length; i++) {
        const char = linea[i];
        if (char === '"') {
          if (entreComillas && linea[i + 1] === '"') { actual += '"'; i++; }
          else { entreComillas = !entreComillas; }
        } else if (char === ',' && !entreComillas) {
          resultado.push(actual);
          actual = '';
        } else {
          actual += char;
        }
      }
      resultado.push(actual);
      return resultado;
    }

    function stockTotal(producto) {
      return SUCURSALES.reduce(function(total, suc) {
        return total + (producto.sucursales[suc] ? producto.sucursales[suc].cantidad : 0);
      }, 0);
    }

    // Convierte el valor crudo de una celda de sucursal en { cantidad, texto }.
    // Soporta tres formas: número (ej "8"), la palabra "Disponible" (stock alto,
    // cantidad exacta desconocida), o vacío/0 (sin stock).
    function interpretarSucursal(valorRaw) {
      const texto = (valorRaw || '').trim();

      if (texto.toLowerCase() === 'disponible') {
        return { cantidad: 999, texto: 'Disponible' };
      }

      const numero = parseInt(texto);
      if (!isNaN(numero) && numero > 0) {
        return { cantidad: numero, texto: String(numero) };
      }

      return { cantidad: 0, texto: null };
    }

    // El estado que ve el cliente refleja solo la columna CD (Disponible / número / sin stock),
    // no la suma de todas las sucursales.
    function estadoCD(producto) {
      const cd = producto.sucursales['CD'];

      if (!cd || cd.cantidad === 0) {
        return { clase: 'sin', texto: 'Sin stock' };
      }
      if (cd.texto === 'Disponible') {
        return { clase: 'disponible', texto: 'Disponible' };
      }
      return { clase: 'poco', texto: cd.texto + ' unidades' };
    }

    async function cargarProductos() {
      const estadoTexto = document.getElementById('estado-texto');
      const btnDescargar = document.getElementById('btn-descargar');
      try {
        const respuesta = await fetch(URL_DATOS);
        if (!respuesta.ok) throw new Error('No se pudo leer la planilla');
        const texto = await respuesta.text();

        const lineas = texto.split(/\r?\n/).filter(function(l) { return l.trim() !== ''; });
        const encabezados = parsearLineaCSV(lineas[0]).map(function(h) { return h.trim().toLowerCase(); });

        const idxNombre = encabezados.indexOf('nombre');
        const idxCodigo = encabezados.indexOf('codigo') !== -1 ? encabezados.indexOf('codigo') : encabezados.indexOf('código');
        const idxMarca = encabezados.indexOf('marca');
        const idxTipo = encabezados.indexOf('tipo');
        const idxMedida = encabezados.indexOf('pp');
        const idxPrecio = encabezados.indexOf('precio');

        const idxSucursales = {};
        SUCURSALES.forEach(function(suc) { idxSucursales[suc] = encabezados.indexOf(suc.toLowerCase()); });

        productos = [];
        for (let i = 1; i < lineas.length; i++) {
          const columnas = parsearLineaCSV(lineas[i]);
          const nombre = columnas[idxNombre] ? columnas[idxNombre].trim() : '';
          if (nombre === '') continue;

          const sucursales = {};
          SUCURSALES.forEach(function(suc) {
            const idx = idxSucursales[suc];
            const valorRaw = (idx !== -1 && columnas[idx]) ? columnas[idx] : '';
            sucursales[suc] = interpretarSucursal(valorRaw);
          });

          productos.push({
            codigo: idxCodigo !== -1 && columnas[idxCodigo] ? columnas[idxCodigo].trim() : '',
            nombre: nombre,
            marca: idxMarca !== -1 && columnas[idxMarca] ? columnas[idxMarca].trim() : '',
            tipo: idxTipo !== -1 && columnas[idxTipo] ? columnas[idxTipo].trim() : '',
            medida: idxMedida !== -1 && columnas[idxMedida] ? columnas[idxMedida].trim() : '',
            precio: idxPrecio !== -1 ? parseFloat(columnas[idxPrecio]) : NaN,
            sucursales: sucursales
          });
        }

        estadoTexto.textContent = 'Escribí una medida para buscar (' + productos.length + ' productos disponibles).';
        btnDescargar.disabled = false;
      } catch (error) {
        estadoTexto.textContent = 'No se pudieron cargar los productos. Probá recargar la página.';
      }
    }

    function renderizarResultados(lista) {
      const contenedor = document.getElementById('resultados');
      contenedor.innerHTML = '';

      if (lista.length === 0) return;

      lista.forEach(function(producto, indice) {
        const st = estadoCD(producto);

        const tarjeta = document.createElement('div');
        tarjeta.className = 'tarjeta';
        tarjeta.innerHTML = `
          <div class="tarjeta-top">
            <div>
              <span class="tarjeta-medida">${producto.medida || '—'}</span>
              <div class="tarjeta-nombre">${producto.nombre}</div>
              <div class="tarjeta-meta"><b>${producto.marca}</b> · ${producto.tipo}${producto.codigo ? ' · Código: ' + producto.codigo : ''}</div>
            </div>
          </div>
          <div class="tarjeta-bottom">
            <span class="precio">${isNaN(producto.precio) ? '' : '$' + producto.precio.toLocaleString('es-CL')}</span>
            <span class="estado-stock ${st.clase}">${st.texto}</span>
            <button class="btn-sucursales" onclick="verSucursales(${indice})">Sucursales</button>
          </div>
        `;
        contenedor.appendChild(tarjeta);
      });
    }

    function verSucursales(indice) {
      const producto = ultimoFiltrado[indice];
      let detalle = producto.nombre + '\n\n';

      const conStock = SUCURSALES.filter(function(suc) {
        return producto.sucursales[suc] && producto.sucursales[suc].cantidad > 0;
      });

      if (conStock.length === 0) {
        detalle += 'Sin stock en ninguna sucursal.';
      } else {
        conStock.forEach(function(suc) {
          detalle += suc + ': ' + producto.sucursales[suc].texto + '\n';
        });
      }

      alert(detalle);
    }

    // Arma una fila plana por producto (datos generales + una columna por sucursal)
    // y dispara la descarga de un archivo .xlsx con el catálogo completo.
    function descargarExcel() {
      const filas = productos.map(function(producto) {
        const fila = {
          'Código': producto.codigo,
          'Nombre': producto.nombre,
          'Marca': producto.marca,
          'Tipo': producto.tipo,
          'Medida': producto.medida,
          'Precio': isNaN(producto.precio) ? '' : producto.precio,
          'Stock total': stockTotal(producto)
        };
        SUCURSALES.forEach(function(suc) {
          fila[suc] = producto.sucursales[suc] ? producto.sucursales[suc].texto || 0 : 0;
        });
        return fila;
      });

      const hoja = XLSX.utils.json_to_sheet(filas);
      const libro = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(libro, hoja, 'Catálogo');

      const fecha = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(libro, 'catalogo-stock-' + fecha + '.xlsx');
    }

    document.getElementById('btn-descargar').addEventListener('click', descargarExcel);

    document.getElementById('buscador').addEventListener('input', function(e) {
      const termino = e.target.value.trim().toLowerCase();

      if (termino === '') {
        ultimoFiltrado = [];
        renderizarResultados([]);
        return;
      }

      ultimoFiltrado = productos.filter(function(p) {
        return p.medida.toLowerCase().includes(termino);
      });

      renderizarResultados(ultimoFiltrado);
    });

    cargarProductos();
  </script>
</body>
</html>
